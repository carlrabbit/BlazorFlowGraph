name: Documentation review
description: Request a focused documentation authority and synchronization review.
title: "Documentation review: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Review `docs/tbps/documentation-review.md` and `docs/tbps/documentation-changes.md` before filling this out.
  - type: textarea
    id: scope
    attributes:
      label: Review scope
    validations:
      required: true
  - type: textarea
    id: concerns
    attributes:
      label: Authority, routing, or synchronization concerns
    validations:
      required: true
