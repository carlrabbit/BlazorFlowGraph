name: Start milestone
description: Start work on an existing milestone.
title: "Start milestone: "
labels:
  - planning
body:
  - type: markdown
    attributes:
      value: |
        Review the milestone document plus `docs/tbps/start-milestone.md` before filling this out.
  - type: input
    id: milestone
    attributes:
      label: Milestone document
      placeholder: docs/milestones/...
    validations:
      required: true
  - type: textarea
    id: readiness
    attributes:
      label: Readiness check
      description: Summarize prerequisites, specs, and decisions already in place.
    validations:
      required: true
