name: Create spec
description: Request a new behavior specification.
title: "Create spec: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Review `docs/SPECS.md`, `docs/specs/README.md`, and `docs/tbps/create-spec.md` before filling this out.
  - type: input
    id: area
    attributes:
      label: Behavior area
      placeholder: e.g. Graph snapshots and version continuity
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Missing authority or behavior gap
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Related docs
      description: List related terminology, architecture, decision, milestone, or workflow docs.
