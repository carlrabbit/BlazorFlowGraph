name: Bug report
description: Report behavior that differs from the documented expectation.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Review the relevant spec in `docs/SPECS.md` and `docs/tbps/bug-investigation.md` before filling this out.
  - type: input
    id: area
    attributes:
      label: Affected behavior area
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Cite the spec, workflow doc, or other authoritative source if known.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Reproduction or validation notes
