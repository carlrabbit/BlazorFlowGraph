name: NuGet Publish

on:
  push:
    tags:
      - "v*.*.*.*"

jobs:
  publish-nuget:
    name: Pack & Publish NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag format
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is invalid. Expected format: vX.X.X.X"
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BlazorFlowGraph.slnx

      - name: Build
        run: dotnet build BlazorFlowGraph.slnx --no-restore --configuration Release

      - name: Pack NuGet packages
        run: |
          while IFS= read -r project; do
            is_packable="$(dotnet msbuild "$project" -nologo -getProperty:IsPackable)"
            if [ "$is_packable" != "true" ]; then
              echo "Skipping non-packable project: $project"
              continue
            fi

            echo "Packing project: $project"
            if ! dotnet pack "$project" --no-build --configuration Release --output artifacts/nuget; then
              echo "Failed to pack project: $project"
              exit 1
            fi
          done < <(find src/DotNet -name "*.csproj" -type f | sort)

      - name: Publish NuGet packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY secret is not set."
            exit 1
          fi

          shopt -s nullglob
          packages=(artifacts/nuget/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No .nupkg files found in artifacts/nuget."
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done

      - name: Upload NuGet artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ github.ref_name }}
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
