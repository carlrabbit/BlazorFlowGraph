name: NuGet Publish

on:
  push:
    tags:
      - "v*.*.*.*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version in vX.X.X.X format"
        required: true
        type: string

jobs:
  publish-nuget:
    name: Pack & Publish NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Prepare release
        id: release
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
        run: bun tooling/release/prepare-release.mjs

      - name: Install TypeScript dependencies
        run: bun install --frozen-lockfile

      - name: Build TypeScript packages
        run: bun run build

      - name: Refresh packaged browser bundle
        run: cp src/TypeScript/packages/host/dist/browser.js src/DotNet/BlazorFlowGraph.Blazor/wwwroot/js/dataflow-visualizer.js

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BlazorFlowGraph.slnx

      - name: Build
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          dotnet build BlazorFlowGraph.slnx --no-restore --configuration Release \
            /p:Version="$RELEASE_VERSION" \
            /p:PackageVersion="$RELEASE_VERSION" \
            /p:AssemblyVersion="$RELEASE_VERSION" \
            /p:FileVersion="$RELEASE_VERSION" \
            /p:InformationalVersion="$RELEASE_TAG"

      - name: Pack NuGet packages
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          while IFS= read -r project; do
            is_packable="$(dotnet msbuild "$project" -nologo -getProperty:IsPackable)"
            if [ "$is_packable" != "true" ]; then
              echo "Skipping non-packable project: $project"
              continue
            fi

            echo "Packing project: $project"
            if ! dotnet pack "$project" --no-build --configuration Release --output artifacts/nuget \
              /p:Version="$RELEASE_VERSION" \
              /p:PackageVersion="$RELEASE_VERSION" \
              /p:AssemblyVersion="$RELEASE_VERSION" \
              /p:FileVersion="$RELEASE_VERSION" \
              /p:InformationalVersion="$RELEASE_TAG"; then
              echo "Failed to pack project: $project"
              exit 1
            fi
          done < <(find src/DotNet -name "*.csproj" -type f | sort)

      - name: Publish NuGet packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY secret is not set."
            exit 1
          fi

          shopt -s nullglob
          packages=(artifacts/nuget/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No .nupkg files found in artifacts/nuget."
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done

      - name: Upload NuGet artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ steps.release.outputs.release_tag }}
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
