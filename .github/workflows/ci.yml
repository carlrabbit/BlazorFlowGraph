name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-dotnet:
    name: Build & Test .NET
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: ./eng/restore.sh

      - name: Build
        run: ./eng/build.sh

      - name: Test
        run: |
          for project in tests/DotNet/BlazorFlowGraph.Protocol.Tests \
                         tests/DotNet/BlazorFlowGraph.Diffing.Tests \
                         tests/DotNet/BlazorFlowGraph.Projection.Tests \
                         tests/DotNet/BlazorFlowGraph.Semantics.Tests; do
            if [ -d "$project" ]; then
              dotnet run --no-build --configuration Release --project "$project" -- --report-trx --results-directory TestResults
            fi
          done

      - name: Validate sample builds
        run: ./eng/ci/validate-samples.sh

      - name: Validate packable projects
        run: ./eng/ci/validate-packages.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "TestResults/*.trx"

      - name: Upload package validation artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-ci-packages
          path: |
            artifacts/ci-pack/*.nupkg
            artifacts/ci-pack/*.snupkg

  build-typescript:
    name: Build & Test TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
