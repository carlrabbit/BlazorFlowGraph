name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Check
        run: ./eng/check.sh

      - name: Validate public docs
        run: ./eng/public-docs.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "TestResults/*.trx"

  validate-artifacts:
    name: Validate Artifacts
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore
        run: ./eng/restore.sh

      - name: Build
        run: ./eng/build.sh

      - name: Validate sample builds
        run: |
          while IFS= read -r sample; do
            echo "Restoring sample: $sample"
            dotnet restore "$sample"
            echo "Building sample: $sample"
            dotnet build "$sample" --no-restore --configuration Release
          done < <(find samples -name "*.csproj" -type f | sort)

      - name: Validate packable projects
        run: |
          mkdir -p artifacts/ci-pack
          while IFS= read -r project; do
            is_packable="$(dotnet msbuild "$project" -nologo -getProperty:IsPackable)"
            if [ "$is_packable" != "true" ]; then
              echo "Skipping non-packable project: $project"
              continue
            fi

            echo "Packing project: $project"
            dotnet pack "$project" --no-build --configuration Release --output artifacts/ci-pack
          done < <(find src/DotNet -name "*.csproj" -type f | sort)

      - name: Upload package validation artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-ci-packages
          path: |
            artifacts/ci-pack/*.nupkg
            artifacts/ci-pack/*.snupkg
