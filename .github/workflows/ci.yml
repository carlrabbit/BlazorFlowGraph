name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-dotnet:
    name: Build & Test .NET
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BlazorFlowGraph.slnx

      - name: Build
        run: dotnet build BlazorFlowGraph.slnx --no-restore --configuration Release

      - name: Test — Diagram.Protocol
        run: dotnet run --no-build --project tests/DotNet/Diagram.Protocol.Tests --configuration Release -- --report-trx --results-directory TestResults

      - name: Test — Diagram.Diffing
        run: dotnet run --no-build --project tests/DotNet/Diagram.Diffing.Tests --configuration Release -- --report-trx --results-directory TestResults

      - name: Test — Diagram.Projection
        run: dotnet run --no-build --project tests/DotNet/Diagram.Projection.Tests --configuration Release -- --report-trx --results-directory TestResults

      - name: Test — Diagram.Semantics
        run: dotnet run --no-build --project tests/DotNet/Diagram.Semantics.Tests --configuration Release -- --report-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "TestResults/*.trx"

  build-typescript:
    name: Build & Typecheck TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  test-typescript:
    name: Test TypeScript
    runs-on: ubuntu-latest
    needs: build-typescript
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test
